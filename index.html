<script type="text/babel" data-presets="react">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

You will generate increasingly concise, entity-dense summaries of the above article.

Repeat the following 2 steps 5 times:
Step 1: Identify 1–3 informative entities from the article which are missing from the previous summary.

A missing entity is: relevant, specific, novel, faithful, and anywhere in the article.

Guidelines:
- First summary should be long (~80 words), highly non-specific, containing little information.
- Make every word count. Rewrite to improve flow and make space for additional entities.

// Shared UI primitives for Spark
const SparkColors = {
  light: {
    bg: '#F5F3EE',
    bg2: '#ECE9E1',
    card: '#FFFFFF',
    ink: '#1A1A1A',
    ink2: '#3A3A3A',
    muted: '#8A8680',
    line: 'rgba(26,26,26,0.08)',
    accent: '#5B4CE5',
    accent2: '#8B7BF5',
  },
  dark: {
    bg: '#0E0D0C',
    bg2: '#1A1918',
    card: '#1F1E1C',
    ink: '#F5F3EE',
    ink2: '#D4D0C7',
    muted: '#8A8680',
    line: 'rgba(245,243,238,0.08)',
    accent: '#8B7BF5',
    accent2: '#B0A5FF',
  },
};

const serifFamily = '"Instrument Serif", "New York", "Iowan Old Style", Georgia, serif';
const sansFamily = '-apple-system, "SF Pro Text", system-ui, sans-serif';
const monoFamily = '"SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace';

function useC() {
  const { dark } = React.useContext(ThemeCtx);
  return dark ? SparkColors.dark : SparkColors.light;
}

const ThemeCtx = React.createContext({ dark: false });

// A pill button / chip
function Pill({ children, onClick, active, dark, style }) {
  const c = dark ? SparkColors.dark : SparkColors.light;
  return (
    <button onClick={onClick} style={{
      border: 'none', outline: 'none', cursor: 'pointer',
      padding: '8px 14px', borderRadius: 999,
      fontFamily: sansFamily, fontSize: 13, fontWeight: 600, letterSpacing: -0.1,
      background: active ? c.ink : c.bg2,
      color: active ? c.bg : c.ink2,
      ...style,
    }}>{children}</button>

function Pedestal({ hue = 265, size = 240, children, dark = false, intensity = 1 }) {
  const bg = dark
    ? `radial-gradient(circle at 50% 45%, hsla(${hue}, 45%, 28%, ${0.9 * intensity}) 0%, hsla(${hue}, 30%, 14%, ${0.6 * intensity}) 45%, rgba(0,0,0,0) 72%)`
    : `radial-gradient(circle at 50% 45%, hsla(${hue}, 70%, 92%, ${0.95 * intensity}) 0%, hsla(${hue}, 50%, 96%, ${0.7 * intensity}) 40%, rgba(255,255,255,0) 72%)`;
  return (
    <div style={{
      width: size, height: size, position: 'relative',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: bg,
    }}>
      {children}
    </div>
  );
}

// Spark — Swipeable deck of tips (Tinder-style)

function DeckScreen({ onClose, onOpenTip, dark }) {
  const c = dark ? SparkColors.dark : SparkColors.light;
  const allTips = SPARK_DATA.tips;
  const [idx, setIdx] = React.useState(0);
  const [drag, setDrag] = React.useState({ x: 0, y: 0, active: false });
  const [lastAction, setLastAction] = React.useState(null); // 'save' | 'skip'
  const [saved, setSaved] = React.useState([]);

  const cardRef = React.useRef(null);
  const startRef = React.useRef(null);

  const onStart = (e) => {
    const p = e.touches ? e.touches[0] : e;
    startRef.current = { x: p.clientX, y: p.clientY };
    setDrag({ x: 0, y: 0, active: true });
  };
  const onMove = (e) => {
    if (!startRef.current) return;
    const p = e.touches ? e.touches[0] : e;
    setDrag({ x: p.clientX - startRef.current.x, y: p.clientY - startRef.current.y, active: true });
  };
  const onEnd = () => {
    if (!startRef.current) return;
    const { x } = drag;
    if (Math.abs(x) > 100) {
      const action = x > 0 ? 'save' : 'skip';
      setLastAction(action);
      if (action === 'save') setSaved(s => [...s, allTips[idx].id]);
      // animate off
      setDrag({ x: x > 0 ? 500 : -500, y: drag.y, active: false });
      setTimeout(() => {
        setIdx(i => Math.min(i + 1, allTips.length));
        setDrag({ x: 0, y: 0, active: false });
      }, 200);
    } else {
      setDrag({ x: 0, y: 0, active: false });
    }
    startRef.current = null;
  };

  const done = idx >= allTips.length;
  const tip = allTips[idx];
  const next = allTips[idx + 1];
  const rot = drag.x / 20;
  const saveOp = Math.max(0, Math.min(1, drag.x / 120));
  const skipOp = Math.max(0, Math.min(1, -drag.x / 120));

  return (
    <div style={{ position: 'absolute', inset: 0, background: c.bg, display: 'flex', flexDirection: 'column', paddingTop: 54 }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 20px 10px' }}>
        <button onClick={onClose} style={{ border: 'none', background: c.bg2, width: 40, height: 40, borderRadius: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          {Icon.close(18, c.ink)}
        </button>
        <div style={{ fontFamily: sansFamily, fontSize: 14, fontWeight: 600, color: c.ink }}>
          {done ? 'Nice work' : `${idx + 1} / ${allTips.length}`}
        </div>
        <div style={{ width: 40, height: 40, borderRadius: 20, background: c.bg2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {Icon.bookmark(16, c.ink)}
        </div>
      </div>
      {/* Progress */}
      <div style={{ padding: '0 20px' }}>
        <div style={{ height: 3, background: c.bg2, borderRadius: 3, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${((done ? allTips.length : idx) / allTips.length) * 100}%`, background: c.ink, transition: 'width .3s' }}/>
        </div>
      </div>

      {/* Cards stage */}
      <div style={{ flex: 1, position: 'relative', padding: '20px 20px 0' }}>
        {done ? <DeckDone c={c} saved={saved} onClose={onClose}/> : (
          <>
            {/* next card (behind) */}
            {next && (
              <DeckCard tip={next} c={c} dark={dark} style={{
                position: 'absolute', inset: '20px 20px 0', transform: 'scale(0.94) translateY(10px)', opacity: 0.6,
              }}/>
            )}
            {/* active card */}
            <div
              onMouseDown={onStart} onMouseMove={drag.active ? onMove : null} onMouseUp={onEnd} onMouseLeave={drag.active ? onEnd : null}
              onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
              style={{
                position: 'absolute', inset: '20px 20px 0',
                transform: `translate(${drag.x}px, ${drag.y}px) rotate(${rot}deg)`,
                transition: startRef.current ? 'none' : 'transform .25s',
                cursor: 'grab',
              }}>
              <DeckCard tip={tip} c={c} dark={dark} saveOp={saveOp} skipOp={skipOp} onOpen={() => onOpenTip(tip.id)}/>
            </div>
          </>
        )}
      </div>

      {/* Actions */}
      {!done && (
        <div style={{ padding: '16px 40px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <ActionBtn label="Skip" color="#E54C4C" onClick={() => { startRef.current = {x:0,y:0}; setDrag({x:-120,y:0,active:true}); setTimeout(onEnd, 10); }}>
            {Icon.close(22, '#E54C4C')}
          </ActionBtn>
          <ActionBtn label="Try it" color="#5B4CE5" big onClick={() => onOpenTip(tip.id)}>
            {Icon.play(28, '#fff', true)}
          </ActionBtn>
          <ActionBtn label="Save" color="#2BB673" onClick={() => { startRef.current = {x:0,y:0}; setDrag({x:120,y:0,active:true}); setTimeout(onEnd, 10); }}>
            {Icon.bookmark(20, '#2BB673', false)}
          </ActionBtn>
        </div>
      )}
    </div>
  );
}

function CatGlyph({ cat }) {
  // a minimal abstract glyph per category, tinted by hue
  const c = `hsl(${cat.hue}, 65%, 45%)`;
  const c2 = `hsl(${cat.hue}, 70%, 60%)`;
  const glyphs = {
    reasoning: <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="22" fill={c2}/><path d="M28 40 L36 48 L52 32" stroke="#fff" strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    structure: <svg width="80" height="80" viewBox="0 0 80 80"><path d="M32 22 L18 40 L32 58" stroke={c} strokeWidth="6" fill="none" strokeLinecap="round"/><path d="M48 22 L62 40 L48 58" stroke={c2} strokeWidth="6" fill="none" strokeLinecap="round"/></svg>,
    control: <svg width="80" height="80" viewBox="0 0 80 80"><rect x="22" y="30" width="36" height="22" rx="5" fill={c2}/><circle cx="32" cy="41" r="3" fill="#fff"/><circle cx="48" cy="41" r="3" fill="#fff"/></svg>,
    summarization: <svg width="80" height="80" viewBox="0 0 80 80"><rect x="18" y="26" width="44" height="6" rx="2" fill={c}/><rect x="18" y="37" width="44" height="6" rx="2" fill={c2}/><rect x="18" y="48" width="26" height="6" rx="2" fill={c2} opacity="0.6"/></svg>,
    'few-shot': <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="30" cy="40" r="10" fill={c2}/><circle cx="50" cy="40" r="10" fill={c} opacity="0.8"/><circle cx="40" cy="40" r="10" fill={c2} opacity="0.5"/></svg>,
    agents: <svg width="80" height="80" viewBox="0 0 80 80"><rect x="30" y="20" width="20" height="20" rx="4" fill={c}/><rect x="16" y="44" width="18" height="18" rx="4" fill={c2}/><rect x="46" y="44" width="18" height="18" rx="4" fill={c2}/><path d="M40 40 L25 44 M40 40 L55 44" stroke={c} strokeWidth="2"/></svg>,
    evals: <svg width="80" height="80" viewBox="0 0 80 80"><path d="M18 56 L30 40 L44 48 L62 22" stroke={c} strokeWidth="4" fill="none" strokeLinecap="round" strokeLinejoin="round"/><circle cx="62" cy="22" r="4" fill={c2}/></svg>,
    cost: <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="18" fill={c2}/><text x="40" y="47" textAnchor="middle" fill="#fff" fontSize="20" fontWeight="800" fontFamily="-apple-system">$</text></svg>,
  };
  return glyphs[cat.id] || glyphs.reasoning;
}

          ))}
        </div>
      </div>

      {/* Settings row */}
      <div style={{ padding: '28px 20px 0' }}>
        <div style={{ background: c.card, borderRadius: 18, border: `1px solid ${c.line}`, overflow: 'hidden' }}>
          <SettingRow c={c} label="Daily reminder"   value="9:00 AM"/>
          <SettingRow c={c} label="Difficulty"        value="Fluent"/>
          <SettingRow c={c} label="Appearance"        value={dark ? 'Dark' : 'Light'} onClick={onToggleDark}/>
          <SettingRow c={c} label="Share your streak" last chev/>
        </div>
      </div>
    </div>
  );
}

function SettingRow({ c, label, value, last, chev, onClick }) {
  return (
    <div onClick={onClick} style={{
      padding: '14px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      borderBottom: last ? 'none' : `1px solid ${c.line}`,
      fontFamily: sansFamily, cursor: onClick ? 'pointer' : 'default',
    }}>
      <div style={{ fontSize: 15, color: c.ink }}>{label}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {value && <div style={{ fontSize: 14, color: c.muted }}>{value}</div>}
        {Icon.chevR(14, c.muted)}
      </div>
    </div>
  );
}

Object.assign(window, { BrowseScreen, PlaygroundScreen, ProfileScreen });


// ===== app.jsx =====
// Spark — main App shell
const TWEAKS = /*EDITMODE-BEGIN*/{
  "dark": false
}/*EDITMODE-END*/;

function TabBar({ tab, setTab, dark }) {
  const c = dark ? SparkColors.dark : SparkColors.light;
  const tabs = [
    { id: 'home',     label: 'Today',   icon: Icon.home },
    { id: 'browse',   label: 'Browse',  icon: Icon.grid },
    { id: 'play',     label: 'Play',    icon: Icon.play },
    { id: 'profile',  label: 'You',     icon: Icon.user },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 30,
      paddingBottom: 20, paddingTop: 6,
      background: dark ? 'rgba(14,13,12,0.85)' : 'rgba(245,243,238,0.85)',
      backdropFilter: 'blur(22px) saturate(180%)',
      WebkitBackdropFilter: 'blur(22px) saturate(180%)',
      borderTop: `1px solid ${c.line}`,
      display: 'flex', justifyContent: 'space-around',
    }}>
      {tabs.map(t => {
        const active = tab === t.id;
        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            border: 'none', background: 'transparent', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
            padding: '8px 14px', color: active ? c.accent : c.muted,
            fontFamily: sansFamily, fontSize: 10, fontWeight: 600, letterSpacing: 0.2,
          }}>
            {t.icon(24, active ? c.accent : c.muted, active)}
            {t.label}
          </button>
        );
      })}
    </div>
  );
}

function TweaksPanel({ open, dark, setDark }) {
  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 24, right: 24, zIndex: 1000, width: 240,
      background: dark ? '#1F1E1C' : '#fff', borderRadius: 18,
      border: `1px solid rgba(0,0,0,0.08)`, padding: 16,
      boxShadow: '0 20px 60px rgba(0,0,0,0.18)',
      fontFamily: sansFamily, color: dark ? '#F5F3EE' : '#1A1A1A',
    }}>
      <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', color: '#8A8680', marginBottom: 12 }}>Tweaks</div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ fontSize: 14, fontWeight: 500 }}>Appearance</div>
        <div style={{
          display: 'flex', padding: 3, borderRadius: 999, background: dark ? '#0E0D0C' : '#ECE9E1',
        }}>
          {['light','dark'].map(m => {
            const active = (m === 'dark') === dark;
            return (
              <button key={m} onClick={() => setDark(m === 'dark')} style={{
                border: 'none', cursor: 'pointer', padding: '6px 12px', borderRadius: 999,
                background: active ? (dark ? '#1F1E1C' : '#fff') : 'transparent',
                color: dark ? '#F5F3EE' : '#1A1A1A',
                fontFamily: sansFamily, fontSize: 12, fontWeight: 600,
                boxShadow: active ? '0 1px 3px rgba(0,0,0,0.12)' : 'none',
                textTransform: 'capitalize',
              }}>{m}</button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [onboarded, setOnboarded] = React.useState(() => localStorage.getItem('spark.onb') === '1');
  const [dark, setDark] = React.useState(TWEAKS.dark);
  const [tab, setTab] = React.useState('home');
  const [tipId, setTipId] = React.useState(null);
  const [deckOpen, setDeckOpen] = React.useState(false);
  const [playTipId, setPlayTipId] = React.useState(null);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}
    return () => window.removeEventListener('message', handler);
  }, []);

  const toggleDark = (v) => {
    const next = typeof v === 'boolean' ? v : !dark;
    setDark(next);
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { dark: next } }, '*'); } catch (e) {}
  };

  const finishOnb = () => { localStorage.setItem('spark.onb', '1'); setOnboarded(true); };

  const c = dark ? SparkColors.dark : SparkColors.light;

  let overlay = null;
  if (!onboarded) overlay = <OnboardingFlow onFinish={finishOnb} dark={dark}/>;
  else if (playTipId) overlay = <PlaygroundScreen tipId={playTipId} onClose={() => setPlayTipId(null)} dark={dark}/>;
  else if (tipId) overlay = <TipDetailScreen tipId={tipId} onClose={() => setTipId(null)} onTryLive={(id) => { setPlayTipId(id); setTipId(null); }} dark={dark}/>;
  else if (deckOpen) overlay = <DeckScreen onClose={() => setDeckOpen(false)} onOpenTip={(id) => { setDeckOpen(false); setTipId(id); }} dark={dark}/>;

  return (
    <ThemeCtx.Provider value={{ dark }}>
      <div data-screen-label={overlay ? 'Overlay' : `Tab: ${tab}`} style={{ position: 'relative' }}>
        <IOSDevice dark={dark}>
          <div style={{ position: 'relative', height: '100%', background: c.bg }}>
            {tab === 'home' && (
              <HomeScreen
                today={SPARK_DATA.today}
                streak={SPARK_DATA.streak}
                onOpenTip={setTipId}
                onOpenDeck={() => setDeckOpen(true)}
                dark={dark}/>
            )}
            {tab === 'browse'  && <BrowseScreen onOpenTip={setTipId} dark={dark}/>}
            {tab === 'play'    && <PlaygroundScreen tipId={SPARK_DATA.today.id} onClose={() => setTab('home')} dark={dark}/>}
            {tab === 'profile' && <ProfileScreen dark={dark} onToggleDark={() => toggleDark()}/>}

            {overlay}

            {!overlay && <TabBar tab={tab} setTab={setTab} dark={dark}/>}
          </div>
        </IOSDevice>
        <TweaksPanel open={tweaksOpen} dark={dark} setDark={toggleDark}/>
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);



</script>
</body>
</html>
