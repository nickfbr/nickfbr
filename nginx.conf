server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN";
}
