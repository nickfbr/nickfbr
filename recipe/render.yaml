# Render Blueprint for the Recipe Box API.
#
# Use this when `recipe/` is the repository root (e.g. after extracting into
# nickfbr/recipe). If deploying from a monorepo where this lives under recipe/,
# move render.yaml to the repo root and prefix the paths below with `recipe/`.
#
# Provisions: a Docker web service, a free managed Postgres, and a free managed
# Redis ("Key Value") instance that backs the global parse rate limiter. The API
# reads all config from environment variables (pydantic-settings).

services:
  - type: web
    name: recipe-box-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Apply migrations once per deploy, before traffic shifts (avoids worker races).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard (secret)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-box-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "2"
      # Global, cross-worker parse rate limiting. Without this the limiter is
      # per-process, so the 20/hour budget effectively multiplies by the number
      # of workers/instances.
      - key: REDIS_URL
        fromService:
          name: recipe-box-redis
          type: redis # Render now labels this "Key Value"; `redis` still resolves.
          property: connectionString

  # Managed Redis / Key Value instance. Internal-only: an empty ipAllowList
  # means no public network access (the web service reaches it privately).
  - type: redis
    name: recipe-box-redis
    plan: free
    ipAllowList: []

databases:
  - name: recipe-box-db
    plan: free
